# Catalogo de unidades de negocio de QUANTUM usado por la etapa negocio_assignment.
#
# Como se resuelve el negocio_id que se escribe en la tabla licitacion:
#   1. sidoc_id de este archivo, si esta completado;
#   2. lookup contra la tabla negocio (NEGOCIO_TABLE_NAME) por nombre o nombres_alternativos;
#   3. DEFAULT_NEGOCIO_ID del .env como ultimo recurso.
#
# Los sidoc_id de abajo se verificaron contra la tabla negocio de la base configurada en
# DATABASE_URL. Estan fijos para que la asignacion no dependa de la conectividad. Si se
# apunta a otra base (staging), verificar que coincidan con: python main.py negocios --list
#
# Listas de keywords, de mayor a menor fuerza:
#   keywords_dominantes: su presencia decide el negocio sin consultar a Gemini.
#     Ante varios dominantes gana el de prioridad mas baja.
#   keywords_fuertes: peso alto en el score.
#   keywords_debiles: peso bajo en el score.
#   keywords_excluyentes: penalizan el score de este negocio.
#
# El match es por palabra completa sobre el texto normalizado (minusculas, sin tildes),
# por lo que las keywords se escriben sin tildes. Se incluyen terminos en espanol,
# ingles y portugues porque el pipeline conserva el idioma original de la fuente.

