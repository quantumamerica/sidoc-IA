enabled: true

official_source_policy:
  description: "Open web discovery must only return official or publicly verifiable sources."
  allowed_source_types:
    - official procurement portals
    - government ministries and agencies
    - energy regulators
    - public utilities and system operators
    - municipalities and public authorities
    - multilateral development banks
    - international organizations
  excluded_source_types:
    - aggregators
    - news articles
    - blogs
    - social media
    - job boards
    - press-only references without an official opportunity URL

themes:
  - id: electricity_tariffs_regulation
    name: Electricity tariffs and regulation
    search_queries:
      - "official tender electricity tariff regulation consulting services deadline"
      - "official procurement power sector tariff study regulatory advisory deadline"
      - "public utility rate design cost of service consulting RFP deadline"
    keywords:
      - electricity
      - tariff
      - regulation
      - rate design
      - cost of service
      - regulatory advisory

  - id: renewable_energy
    name: Renewable energy, auctions and grid integration
    search_queries:
      - "official tender renewable energy solar wind consulting feasibility study deadline"
      - "government procurement renewable energy auctions grid integration advisory deadline"
      - "official RFP distributed generation renewable energy technical assistance"
    keywords:
      - renewable energy
      - solar
      - wind
      - distributed generation
      - auctions
      - grid integration

  - id: natural_gas
